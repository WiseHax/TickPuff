[package]
name = "tickpuff"
version = "0.3.0"
description = "A lightweight ambient desktop clock with a living 3D companion"
authors = ["TickPuff contributors"]
license = "MIT"
repository = "https://github.com/WiseHax/TickPuff"
edition = "2021"
rust-version = "1.88"

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name
# (see https://github.com/rust-lang/cargo/issues/8519).
name = "tickpuff_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.38", default-features = false, features = ["system"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Foundation",
  "Media_Control",
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Performance",
] }

# Size-focused release profile: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
